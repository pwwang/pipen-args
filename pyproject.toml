[project]
name = "pipen-args"
dynamic = ["version"]
description = "Command-line argument parser for pipen."
authors = [{ name = "pwwang", email = "pwwang@pwwang.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pipen-annotate>=1.0",
]

[tool.hatch.version]
path = "pipen_args/version.py"

[project.urls]
Homepage = "https://github.com/pwwang/pipen-args"
Repository = "https://github.com/pwwang/pipen-args"

[project.entry-points.pipen]
args = "pipen_args.plugin:ArgsPlugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=1",
    "pytest-xdist>=3",
    "pytest-forked>=1",
    "pipen-verbose>=1.1",
    "backports-asyncio-runner>=1.1.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v -n auto --cov pipen_args --cov-report xml:.coverage.xml --cov-report term-missing"
filterwarnings = [
    "error"
]
# console_output_style = "progress"
# junit_family = "xunit1"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = ["attr-defined", "no-redef", "union-attr", "import"]
show_error_codes = true
strict_optional = false

[tool.uv]
prerelease = "allow"

[tool.pyright]
ignore = ["tests/"]
reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOptionalIterable = false
reportOptionalOperand = false
reportIncompatibleVariableOverride = false
reportAttributeAccessIssue = false
